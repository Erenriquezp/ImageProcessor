name: CI

on:
  push:
    branches: [main, develop, "fase/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Build y tests (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # El nucleo sigue en Java 21; app y bench exigen JDK 25 (JavaFX 25)
      # verify: compila, ejecuta tests, Checkstyle (informe) y JaCoCo (informe, sin umbral)
      - name: Build y tests
        run: ./mvnw -B -ntp verify ${{ matrix.java == '21' && '-pl core-imaging' || '' }}
        shell: bash

      - name: Subir informe de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/target/site/jacoco/
            lab-plugin/target/site/jacoco-aggregate/
          if-no-files-found: ignore

      - name: Subir resultados de surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/checkstyle-result.xml
          if-no-files-found: ignore

  # Humo de la interfaz con el toolkit real; no bloquea mientras no tenga historial
  ui-smoke:
    name: Humo de la interfaz (xvfb)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Humo
        run: xvfb-run -a ./mvnw -B -ntp -Pui-smoke -pl app -am test

  # Opcional y no bloqueante: formato (solo codigo cambiado) y SpotBugs
  quality-report:
    name: Informes de calidad (no bloquean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Spotless ratchet necesita el historial y origin/develop

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Spotless (formato, solo codigo modificado)
        run: ./mvnw -B -ntp spotless:check -Dspotless.ratchet=origin/develop
        continue-on-error: true

  spotbugs:
    name: SpotBugs (JDK 25, informe)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: SpotBugs
        run: ./mvnw -B -ntp compile spotbugs:spotbugs
        continue-on-error: true

      - name: Subir informe de SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: "**/target/spotbugsXml.xml"
          if-no-files-found: ignore
