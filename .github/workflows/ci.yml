name: CI

on:
  push:
    branches: [main, develop, "fase/**"]
  pull_request:
    branches: [main, develop]

# Mínimos: solo leer el repositorio. Ningún job publica nada.
permissions:
  contents: read

jobs:
  build:
    name: Build y tests (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ["21", "25"]
    steps:
      # Acciones oficiales fijadas por SHA de commit (la etiqueta va en el comentario).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # JDK 21: los módulos que siguen en Java 21. JDK 25: todo.
      # Los tests del modelo real (ai-real) quedan fuera por el POM de ai-engine; el humo con
      # pantalla va aparte (ui-smoke). verify: tests, Checkstyle (informe) y JaCoCo (informe).
      - name: Build y tests
        run: ./mvnw -B -ntp verify ${{ matrix.java == '21' && '-pl core-imaging,imaging-io,wallpapers -am' || '' }}
        shell: bash

      - name: Subir informe de JaCoCo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/target/site/jacoco/
            lab-plugin/target/site/jacoco-aggregate/
          if-no-files-found: ignore

      - name: Subir resultados de surefire
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/checkstyle-result.xml
          if-no-files-found: ignore

  # THIRD_PARTY_LICENSES.md debe coincidir con lo que genera el plugin de licencias.
  licenses:
    name: Licencias de terceros al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Regenerar y comparar
        run: |
          ./mvnw -B -ntp -DskipTests install
          ./mvnw -B -ntp license:aggregate-add-third-party@third-party
          git diff --exit-code -- THIRD_PARTY_LICENSES.md

  # Humo de la interfaz con el toolkit real; no bloquea mientras no tenga historial
  ui-smoke:
    name: Humo de la interfaz (xvfb)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Humo
        run: xvfb-run -a ./mvnw -B -ntp -Pui-smoke -pl app -am test

  # Opcional y no bloqueante: formato (solo codigo cambiado) y SpotBugs
  quality-report:
    name: Informes de calidad (no bloquean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Spotless ratchet necesita el historial y origin/develop
          persist-credentials: false

      - name: Configurar JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Spotless (formato, solo codigo modificado)
        run: ./mvnw -B -ntp spotless:check -Dspotless.ratchet=origin/develop
        continue-on-error: true

  spotbugs:
    name: SpotBugs (JDK 25, informe)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: SpotBugs
        run: ./mvnw -B -ntp compile spotbugs:spotbugs
        continue-on-error: true

      - name: Subir informe de SpotBugs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotbugs-report
          path: "**/target/spotbugsXml.xml"
          if-no-files-found: ignore
